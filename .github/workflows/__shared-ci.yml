name: Common Continuous Integration tasks

on:
  workflow_call:
    outputs:
      build-artifact-id:
        description: "The artifact ID of the build output"
        value: ${{ jobs.nodejs.outputs.build-artifact-id }}
      package-tarball-artifact-id:
        description: "The artifact ID of the uploaded package tarball"
        value: ${{ jobs.nodejs.outputs.package-tarball-artifact-id }}

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@90211d735aa0289702ddbd7eb95b218020ccadad # 2.0.2
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      linter-env: |
        FILTER_REGEX_EXCLUDE=packages/theme/lib/**/*,packages/docs/build/**/*

  nodejs:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@02a04ad25ceaacdf3b7200e45fb7fec07fadf4fa # 2.1.0
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      package: |
        {
          "test-project": "packages/docs",
          "tests": "npm run build"
        }
      build: |
        {
          "artifact": ["packages/theme/lib", "packages/docs/build"]
        }
