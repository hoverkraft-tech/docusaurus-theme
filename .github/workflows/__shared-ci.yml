name: Common Continuous Integration tasks

on:
  workflow_call:
    outputs:
      build-artifact-id:
        description: "The artifact ID of the build output"
        value: ${{ jobs.nodejs.outputs.build-artifact-id }}
      package-tarball-artifact-id:
        description: "The artifact ID of the uploaded package tarball"
        value: ${{ jobs.nodejs.outputs.package-tarball-artifact-id }}

permissions: {}

jobs:
  lint:
    name: linter
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@f44e1bcc350b6bfe9e4a86a27b1d5e032e58f292 # 4.2.1
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      comment: false
      linter-env: |
        FILTER_REGEX_EXCLUDE=packages/theme/lib/**/*,packages/docs/build/**/*

  nodejs:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@a60704c5e9902675a1b4a5141411d95733e80ff5 # 3.0.2
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      test: '{"comment": false, "report-group": "nodejs"}'
      package: |
        {
          "test-project": "packages/docs",
          "tests": "npm run build"
        }
      build: |
        {
          "artifact": ["packages/theme/lib", "packages/docs/build"]
        }

  reports:
    needs: [lint, nodejs]
    if: always()
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@f44e1bcc350b6bfe9e4a86a27b1d5e032e58f292 # 4.2.1
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
